services:
  security7AndJwtMysql:
    image: mysql:8.0
    container_name: security7AndJwtMysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: security7AndJwt
      TZ: Asia/Seoul

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data: